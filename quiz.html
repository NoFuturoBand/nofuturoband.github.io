<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>¿Qué canción de Punk de Terapia eres? | NO FUTURO</title>

<meta name="description" content="Descubre qué canción del álbum Punk de Terapia de NO FUTURO describe tu momento. Responde el quiz y encuentra tu canción.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="¿Qué canción de Punk de Terapia eres? | NO FUTURO">
<meta property="og:description" content="Responde el quiz y descubre qué canción de NO FUTURO describe tu momento.">
<meta property="og:image" content="https://punkdeterapia.com/assets/terapia.jpg">
<meta property="og:url" content="https://punkdeterapia.com/quiz.html">
<meta property="og:type" content="website">
    
    
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" type="image/png" href="assets/favicon.png">

<style>
    body{
        background:#f2f2f2;
    }
</style>
    
</head>

<body>
    
<section class="hero-section">

<div class="section-inner">

<div id="app" class="quiz-app">

<h2 class="quiz-question">
Descubre qué canción describe tu momento.
</h2>

<p class="quiz-subtitle">
No hay respuestas correctas. Solo honestidad.
</p>

<a onclick="startQuiz()" class="platform-button quiz-btn">Comenzar</a>

</div>

</div>

</section>

<script>

function toggleMenu(){
    const menu = document.getElementById("mobileDropdown");
    menu.classList.toggle("show");
}

    
let step = 0;
let answers = [];

const questions = [
"¿Aún te afecta emocionalmente una relación que terminó?",
"¿Sientes que has tenido que aceptar situaciones que no salieron como esperabas?",
"¿Alguna vez alguien en quien confiabas te falló profundamente?",
"¿Sientes que muchas cosas en tu vida no salen como quisieras?",
"¿Evitas algunas situaciones por miedo a lo que podría pasar?",
"Cuando algo duele, normalmente tú lo enfrentas?"
];

// Pesos emocionales
const weights = [5,4,3,2,1];

// Perfil emocional de canciones
const songs = [

{
name:"Pongo en adopción a mi perro",
profile:[1,0,0,1,0]
},

{
name:"Detrás de los cristales",
profile:[0,1,1,1,0]
},

{
name:"Para mí",
profile:[0,1,1,1,0]
},

{
name:"No aprendí a bailar",
profile:[1,1,0,1,0]
},

{
name:"Demasiado viejos para cantar rap por eso cantamos punk",
profile:[0,1,0,1,0]
},

{
name:"Pánico al pogo",
profile:[0,0,0,0,1]
},

{
name:"Es lo que hay",
profile:[1,1,0,1,0]
},

{
name:"Pésimo servicio",
profile:[1,1,0,1,0]
},

{
name:"Tal vez",
profile:[1,1,0,0,1]
},

{
name:"Suficiente",
profile:[1,1,1,1,1]
}

];

const songDescriptions = [

    // Pongo en adopción a mi perro
    "Esta canción es el inicio del caos: Un reconocimiento sobre la incapacidad de ser, el desesperado intento por encajar y la incapacidad de amar.",
    // Detrás de los cristales
    "Esta canción retrata qué se siente al estar frente a un espejo 20 años despues y entender qué fue lo que sucedió. Un poco tarde. Siempre miope, a pesar de estar detrás de los cristales.",
    // Para mí
    "Algunas personas tienen recuerdos preciados del colegio. Amigos que han durado toda la vida. Parte de la personalidad que somos hoy como adultos funcionales viene de allí. Para otras personas no fue tan así. De eso se trata esta canción.",
    //No aprendí a bailar
    "¿Cuántas veces hemos intentado hacer algo que para todos es tan fácil y para nosotros implica un esfuerzo espectacular? Aquí la comparación con el primo que todo lo puede hacer fácil aplica para el amigo, el jefe, la familia. A veces simplemente podemos verlos desde lejos en la fiesta de la vida y nos preguntamos: ¿por qué no aprendí a bailar?",
    //Demasiado viejos para cantar rap por eso cantamos punk
    "El punk como herramienta de expresión imprecisa, desafinada e incorrecta es la solución perfecta para no ser perfectos. No saber cantar, escribir o soñar está bien: para eso está el punk.",
    //Pánico al pogo
    "¿Saben qué es ir a un toque con gafas y brackets?",
    //Es lo que hay
    "Siempre hay forma de poder actuar de forma consecuente, respuetuosa y madura. Pero cambiar lo que somos no es una opción. Hay cosas que no no cambiarán, que no mejorarán. Aprendemos a vivir con ellas. Es posible que duela un poco, pero es lo que hay",
    //Pésimo servicio
    "Después de todo lo vivido. Después de aprender a sentir. Después de tocar el cielo. Ser sólo una decepción. Un pésimo servicio. Ser sólo un mal recuerdo y una calificación final: dos estrellas.",
    //Tal vez
    "Esta canción es un bolero punk. Trata sobre cómo poner todo en una balanza. Es la primera duda. Todo empieza con un: y si tal vez...",
    //Suficiente
    "Una de las trampas del síndrome del impostor es sentir que nunca somos suficientes. Esta canción trata sobre la inseguridad e inestabilidad que causa no sentirse capaz. No sentirse completo. No ser suficiente."
];

    
function startQuiz(){

step = 0;
answers = [];

showQuestion();

}

function showQuestion(){

if(step < questions.length){

document.getElementById("app").innerHTML = `
<h2 class="quiz-question">${questions[step]}</h2>

<a onclick="answer(1)" class="platform-button quiz-btn">Sí</a>
<a onclick="answer(0)" class="platform-button quiz-btn">No</a>

${getHistoryHTML()}
`;

}
else{

showResult();

}

}

function answer(value){

answers.push(value);

step++;

showQuestion();

}

  function getHistoryHTML(){

let history = "<div class='history'>";

for(let i = 0; i < answers.length; i++){

let response = answers[i] === 1 ? "Sí" : "No";

history += `
<p style="font-size:14px; margin:5px 0;">
<b>${questions[i]}</b><br>
Respuesta: ${response}
</p>
`;

}

history += "</div>";

return history;

}

  function showResult(){

let emotionalAnswers = answers.slice(0,5);
let tieBreaker = answers[5];

let bestScore = -1;
let bestSongs = [];

// Calcular puntajes

songs.forEach(song => {

let score = 0;

for(let i=0;i<5;i++){

score += emotionalAnswers[i] *
song.profile[i] *
weights[i];

}

if(score > bestScore){

bestScore = score;
bestSongs = [song.name];

}

else if(score === bestScore){

bestSongs.push(song.name);

}

});

// Resolver empate con mezcla

let finalSong;

if(bestSongs.length === 1){

finalSong = bestSongs[0];

}
else{

// índice variable según respuestas

let sumAnswers =
answers.reduce((a,b)=>a+b,0);

let index =
(sumAnswers + tieBreaker) %
bestSongs.length;

finalSong =
bestSongs[index];

}

const songIndex = songs.findIndex(s => s.name === finalSong);
const trackNumber = songIndex + 1;
const audioSrc = `assets/muestras/${trackNumber}.mp3`;
const description = songDescriptions[songIndex];

// Mostrar resultado
document.getElementById("app").innerHTML = `

<h2 class="quiz-question" style="font-size:16px;">
TU CANCIÓN ES
</h2>

<h1 class="quiz-result">${finalSong}</h1>

<p style="
    color:#111111;
    font-size:16px;
    line-height:1.8;
    text-align:center;
    max-width:420px;
    margin:30px auto;
    font-style:italic;
">${description}</p>

<audio id="quizAudio" src="${audioSrc}" preload="auto"></audio>

<button id="playBtn" onclick="togglePlay()" style="
    background:#d62828;
    color:#ffffff;
    border:none;
    border-radius:50%;
    width:56px;
    height:56px;
    font-size:20px;
    cursor:pointer;
    display:block;
    margin:0 auto 30px auto;
    transition:0.2s;
">▶</button>

<a onclick="startQuiz()" class="platform-button quiz-btn">Intentar de nuevo</a>

`;

}

function togglePlay(){

    const audio = document.getElementById("quizAudio");
    const btn = document.getElementById("playBtn");

    if(!audio) return;

    if(audio.paused){
        audio.currentTime = 0;
        audio.play();
        btn.textContent = "⏹";
    } else {
        audio.pause();
        audio.currentTime = 0;
        btn.textContent = "▶";
    }

    audio.onended = function(){
        btn.textContent = "▶";
    };

}
    
</script>

</body>
</html>

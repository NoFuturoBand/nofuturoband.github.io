<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match de Canción</title>
    
<link rel="stylesheet" href="assets/css/style.css">

<style>
    body{
        background:#f2f2f2;
    }
</style>
    
</head>

<body>
    
<section class="hero-section">

<div class="section-inner">

<div id="app" class="quiz-app">

<h2 class="quiz-question">
Descubre qué canción describe tu momento.
</h2>

<p class="quiz-subtitle">
No hay respuestas correctas. Solo honestidad.
</p>

<a onclick="startQuiz()" class="platform-button quiz-btn">Comenzar</a>

</div>

</div>

</section>

<script>

function toggleMenu(){
    const menu = document.getElementById("mobileDropdown");
    menu.classList.toggle("show");
}

    
let step = 0;
let answers = [];

const questions = [
"¿Aún te afecta emocionalmente una relación que terminó?",
"¿Sientes que has tenido que aceptar situaciones que no salieron como esperabas?",
"¿Alguna vez alguien en quien confiabas te falló profundamente?",
"¿Sientes que muchas cosas en tu vida no salen como quisieras?",
"¿Evitas algunas situaciones por miedo a lo que podría pasar?",
"Cuando algo duele, normalmente tú lo enfrentas?"
];

// Pesos emocionales
const weights = [5,4,3,2,1];

// Perfil emocional de canciones
const songs = [

{
name:"Pongo en adopción a mi perro",
profile:[1,0,0,1,0]
},

{
name:"Detrás de los cristales",
profile:[0,1,1,1,0]
},

{
name:"Para mí",
profile:[0,1,1,1,0]
},

{
name:"No aprendí a bailar",
profile:[1,1,0,1,0]
},

{
name:"Demasiado viejos para cantar rap por eso cantamos punk",
profile:[0,1,0,1,0]
},

{
name:"Pánico al pogo",
profile:[0,0,0,0,1]
},

{
name:"Es lo que hay",
profile:[1,1,0,1,0]
},

{
name:"Pésimo servicio",
profile:[1,1,0,1,0]
},

{
name:"Tal vez",
profile:[1,1,0,0,1]
},

{
name:"Suficiente",
profile:[1,1,1,1,1]
}

];

const songDescriptions = [
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción",
    "significado de la canción"
];

    
function startQuiz(){

step = 0;
answers = [];

showQuestion();

}

function showQuestion(){

if(step < questions.length){

document.getElementById("app").innerHTML = `
<h2 class="quiz-question">${questions[step]}</h2>

<a onclick="answer(1)" class="platform-button quiz-btn">Sí</a>
<a onclick="answer(0)" class="platform-button quiz-btn">No</a>

${getHistoryHTML()}
`;

}
else{

showResult();

}

}

function answer(value){

answers.push(value);

step++;

showQuestion();

}

  function getHistoryHTML(){

let history = "<div class='history'>";

for(let i = 0; i < answers.length; i++){

let response = answers[i] === 1 ? "Sí" : "No";

history += `
<p style="font-size:14px; margin:5px 0;">
<b>${questions[i]}</b><br>
Respuesta: ${response}
</p>
`;

}

history += "</div>";

return history;

}

  function showResult(){

let emotionalAnswers = answers.slice(0,5);
let tieBreaker = answers[5];

let bestScore = -1;
let bestSongs = [];

// Calcular puntajes

songs.forEach(song => {

let score = 0;

for(let i=0;i<5;i++){

score += emotionalAnswers[i] *
song.profile[i] *
weights[i];

}

if(score > bestScore){

bestScore = score;
bestSongs = [song.name];

}

else if(score === bestScore){

bestSongs.push(song.name);

}

});

// Resolver empate con mezcla

let finalSong;

if(bestSongs.length === 1){

finalSong = bestSongs[0];

}
else{

// índice variable según respuestas

let sumAnswers =
answers.reduce((a,b)=>a+b,0);

let index =
(sumAnswers + tieBreaker) %
bestSongs.length;

finalSong =
bestSongs[index];

}

const songIndex = songs.findIndex(s => s.name === finalSong);
const trackNumber = songIndex + 1;
const audioSrc = `assets/muestras/${trackNumber}.mp3`;
const description = songDescriptions[songIndex];

// Mostrar resultado
document.getElementById("app").innerHTML = `

<h2 class="quiz-question" style="font-size:16px;">
TU CANCIÓN ES
</h2>

<h1 class="quiz-result">${finalSong}</h1>

<p style="
    color:#111111;
    font-size:16px;
    line-height:1.8;
    text-align:center;
    max-width:420px;
    margin:30px auto;
    font-style:italic;
">${description}</p>

<audio id="quizAudio" src="${audioSrc}" preload="auto"></audio>

<button id="playBtn" onclick="togglePlay()" style="
    background:#d62828;
    color:#ffffff;
    border:none;
    border-radius:50%;
    width:56px;
    height:56px;
    font-size:20px;
    cursor:pointer;
    display:block;
    margin:0 auto 30px auto;
    transition:0.2s;
">▶</button>

<a onclick="startQuiz()" class="platform-button quiz-btn">Intentar de nuevo</a>

`;

}

let audioPlaying = false;

function togglePlay(){

    const audio = document.getElementById("quizAudio");
    const btn = document.getElementById("playBtn");

    if(!audio) return;

    if(!audioPlaying){
        audio.currentTime = 0;
        audio.play();
        audioPlaying = true;
        btn.textContent = "⏹";
    } else {
        audio.pause();
        audio.currentTime = 0;
        audioPlaying = false;
        btn.textContent = "▶";
    }

    audio.onended = function(){
        audioPlaying = false;
        btn.textContent = "▶";
    };

}
    
</script>

</body>
</html>
